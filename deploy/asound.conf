# /etc/asound.conf for Pimoroni Pirate Audio.
# default -> softvol ("Master" control, used for the alarm fade) -> dmix -> hifiberry DAC.
# dmix lets librespot and the fallback chime share the DAC; ipc_perm lets different users use it.

pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:sndrpihifiberry"
        format S16_LE
        rate 44100
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.softvol {
    type softvol
    slave.pcm "dmixer"
    control {
        name "Master"
        card sndrpihifiberry
    }
    min_dB -45.0
    max_dB 0.0
}

pcm.!default {
    type plug
    slave.pcm "softvol"
}

ctl.!default {
    type hw
    card sndrpihifiberry
}
