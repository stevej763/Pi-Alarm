# Settings for /etc/raspotify/conf (set or uncomment these lines in that file).
LIBRESPOT_NAME="Radio Alarm"
LIBRESPOT_BACKEND="alsa"
# The /etc/asound.conf default device (softvol -> dmix -> DAC)
LIBRESPOT_DEVICE="default"
# The alarm app controls loudness through ALSA "Master", so librespot stays at full scale.
LIBRESPOT_VOLUME_CTRL="fixed"
LIBRESPOT_INITIAL_VOLUME="100"
LIBRESPOT_BITRATE="160"
LIBRESPOT_DEVICE_TYPE="speaker"
# Keep the login so the device is listed by the Spotify Web API right after boot.
LIBRESPOT_CACHE="/var/cache/raspotify"
LIBRESPOT_DISABLE_AUDIO_CACHE=
